<body>
<title>Recipe Repo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with two views (library grid / grocery list); dialogs for recipe detail and editing */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --sunk:#e8ece5; --line:#d5dbd1;
  --ink:#1d2621; --muted:#5d6a62; --accent:#2f6b4f; --accent-ink:#ffffff;
  --mustard:#c99a1e; --mustard-soft:#f6ebc9; --danger:#b23a2b;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
  /* meal colors: soft fill + strong ink */
  --breakfast-bg:#fbefc8; --breakfast:#8a6200;
  --lunch-bg:#d6eef0;     --lunch:#1f6d74;
  --dinner-bg:#ece0f2;    --dinner:#6b3a86;
  --side-bg:#dfeedd;      --side:#3c6e35;
  --dessert-bg:#f8e0e6;   --dessert:#a03a58;
  --snack-bg:#fde3cf;     --snack:#a2531a;
  /* tag kinds */
  --t-diet:#3c7d4a; --t-gf:#a8740a; --t-time:#2f6390; --t-kid:#b0436a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a17; --surface:#1d2420; --sunk:#252d28; --line:#33403a;
  --ink:#e6ece7; --muted:#9aa9a0; --accent:#6fbf94; --accent-ink:#0f1a14;
  --mustard:#e2b844; --mustard-soft:#3a3320; --danger:#ef7b6b;
  --breakfast-bg:#3a3016; --breakfast:#f0c95a; --lunch-bg:#16363a; --lunch:#7fd0d6;
  --dinner-bg:#33243d; --dinner:#cfa4e6; --side-bg:#1f3320; --side:#9fd394;
  --dessert-bg:#3d2029; --dessert:#f2a3b8; --snack-bg:#3d2817; --snack:#f5b07a;
  --t-diet:#8fd19e; --t-gf:#e8bf5c; --t-time:#8ab8e6; --t-kid:#f09ab8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a17; --surface:#1d2420; --sunk:#252d28; --line:#33403a;
  --ink:#e6ece7; --muted:#9aa9a0; --accent:#6fbf94; --accent-ink:#0f1a14;
  --mustard:#e2b844; --mustard-soft:#3a3320; --danger:#ef7b6b;
  --breakfast-bg:#3a3016; --breakfast:#f0c95a; --lunch-bg:#16363a; --lunch:#7fd0d6;
  --dinner-bg:#33243d; --dinner:#cfa4e6; --side-bg:#1f3320; --side:#9fd394;
  --dessert-bg:#3d2029; --dessert:#f2a3b8; --snack-bg:#3d2817; --snack:#f5b07a;
  --t-diet:#8fd19e; --t-gf:#e8bf5c; --t-time:#8ab8e6; --t-kid:#f09ab8; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.tab{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.count{font-family:var(--f-mono);font-size:.75rem;background:var(--mustard);color:#1d1a10;border-radius:999px;padding:0 7px;min-width:20px;text-align:center}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 10px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

main{padding-block:20px 60px}
.notice{background:var(--mustard-soft);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:.92rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 240px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chiprow .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);width:64px;flex:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
[data-meal]{--mc-bg:var(--sunk);--mc:var(--muted)}
[data-meal="Breakfast"]{--mc-bg:var(--breakfast-bg);--mc:var(--breakfast)}
[data-meal="Lunch"]{--mc-bg:var(--lunch-bg);--mc:var(--lunch)}
[data-meal="Dinner"]{--mc-bg:var(--dinner-bg);--mc:var(--dinner)}
[data-meal="Side"]{--mc-bg:var(--side-bg);--mc:var(--side)}
[data-meal="Dessert"]{--mc-bg:var(--dessert-bg);--mc:var(--dessert)}
[data-meal="Snack"]{--mc-bg:var(--snack-bg);--mc:var(--snack)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mc);flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative}
.card .band{background:var(--mc-bg);color:var(--mc);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 16px;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border-bottom:1px dashed color-mix(in srgb,var(--mc) 35%,transparent)}
.card .band>span:first-child{flex:none}
.card .band .time{font-family:var(--f-mono);letter-spacing:0;text-transform:none;font-weight:500;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .cuisine{font-size:.8rem;color:var(--muted);font-style:italic}
.card.picked{border-color:var(--mc);box-shadow:0 0 0 1px var(--mc)}
.card.picked::after{content:"✓";position:absolute;top:5px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--mc);color:var(--surface);font-size:.75rem;font-weight:700;display:grid;place-items:center}
.card.picked .band .time{margin-right:22px}
.card h3{font-size:1.2rem;font-weight:700}
.card h3 button{all:unset;cursor:pointer}
.card h3 button:hover{text-decoration:underline;text-underline-offset:3px}
.card h3 button:focus-visible{outline:2px solid var(--accent)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{--tc:var(--muted);font-size:.75rem;border:1px solid color-mix(in srgb,var(--tc) 45%,transparent);color:var(--tc);border-radius:999px;padding:0 8px;display:inline-flex;align-items:center;gap:5px;font-weight:700}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tc)}
.tag[data-k="diet"]{--tc:var(--t-diet)} .tag[data-k="gf"]{--tc:var(--t-gf)} .tag[data-k="time"]{--tc:var(--t-time)} .tag[data-k="kid"]{--tc:var(--t-kid)}
.tag.ex{background:var(--mustard-soft);border-color:transparent;color:var(--ink)} .tag.ex::before{display:none}
.card .foot .btn{white-space:nowrap;flex:none}
.card .foot .hint{min-width:0}
.chip .tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tc,var(--muted));margin-right:6px;vertical-align:1px}
.chip[data-k="diet"]{--tc:var(--t-diet)}.chip[data-k="gf"]{--tc:var(--t-gf)}.chip[data-k="time"]{--tc:var(--t-time)}.chip[data-k="kid"]{--tc:var(--t-kid)}
.card .foot .btn.primary{background:var(--mc);border-color:var(--mc);color:var(--surface)}
.chip .dot{margin-right:6px;vertical-align:1px}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--bg)}
.meal .dot{width:10px;height:10px}
.sheetband{margin:-22px -22px 0;padding:10px 22px;background:var(--mc-bg);color:var(--mc);border-radius:14px 14px 0 0;font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px}
.sheet[data-meal] .actions .btn.primary{background:var(--mc);border-color:var(--mc);color:var(--surface)}
.sheetband .time{font-family:var(--f-mono);letter-spacing:0;text-transform:none;font-weight:500}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s,box-shadow .15s,transform .15s}.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px -10px color-mix(in srgb,var(--mc) 70%,transparent)}.card.picked:hover{box-shadow:0 0 0 1px var(--mc),0 6px 18px -10px var(--mc)}}
.card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:6px}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:1.3rem;margin-bottom:6px}

/* grocery view */
.glayout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:24px;align-items:start}
@media (max-width:760px){.glayout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font-size:1.15rem;margin-bottom:10px}
.meal{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .nm{flex:1;min-width:0;font-weight:700}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px}
.stepper button{border:0;background:none;width:28px;height:28px;font-weight:700}
.stepper span{font-family:var(--f-mono);font-size:.85rem;min-width:56px;text-align:center}
.aisle{margin-top:14px}
.aisle h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-family:var(--f-body);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:4px}
.item{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.item input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.item .q{font-family:var(--f-mono);font-size:.88rem;min-width:84px;color:var(--accent);flex:none;font-variant-numeric:tabular-nums}
.item .n{flex:1;min-width:0}
.item .from{display:block;font-size:.78rem;color:var(--muted)}
.item.done .n,.item.done .q{text-decoration:line-through;opacity:.5}
.share{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.addextra{display:flex;gap:8px;margin-top:14px}
.addextra input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.hint{font-size:.85rem;color:var(--muted)}

/* overlay */
.overlay{position:fixed;inset:0;background:rgb(10 15 12 / .55);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:680px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sheet .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{font-size:1.6rem}
.ing{list-style:none;padding:0;margin:0}
.ing li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dotted var(--line)}
.ing .q{font-family:var(--f-mono);font-size:.88rem;min-width:84px;color:var(--accent)}
.steps{white-space:pre-wrap;margin:0;line-height:1.6;max-width:65ch}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
.field textarea{resize:vertical;min-height:110px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:30;font-weight:700}
.backup{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:28px;padding-top:14px;border-top:1px solid var(--line)}
.backup .hint{margin-right:auto}
.staples{margin-top:18px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.staples h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-family:var(--f-body);font-weight:700;margin-bottom:4px}
.staples .item{padding:4px 0}
.staplechips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.staplechips .chip{display:inline-flex;gap:4px;align-items:center}
.staplechips form{display:flex;gap:6px;flex:1 1 180px;min-width:0}
.staplechips input{flex:1;min-width:0;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.88rem}
.wake[aria-pressed="true"]{background:var(--mustard-soft);border-color:var(--mustard)}
.gate{position:fixed;inset:0;z-index:25;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gate .box{max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center}
.gate img{width:88px;height:88px;border-radius:20px}
.gate h2{font-size:1.8rem}
.gate p{margin:0;color:var(--muted)}
.gate .err{color:var(--danger);font-size:.92rem}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:11px 20px;font-weight:700;font-size:1rem}
.gbtn svg{width:20px;height:20px}
.copybox{width:100%;min-height:160px;font-family:var(--f-mono);font-size:.85rem;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
</style>

<header>
  <div class="wrap bar">
    <div class="brand"><h1>Recipe Repo</h1><small id="status">Loading…</small></div>
    <button class="btn small primary" id="installBtn" hidden>Install app</button>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-recipes" aria-selected="true" data-view="recipes">Recipes</button>
      <button class="tab" role="tab" id="tab-list" aria-selected="false" data-view="list">Grocery list <span class="count" id="mealcount">0</span></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="notice" id="notice" hidden></div>

  <section id="view-recipes">
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Search recipes or ingredients" aria-label="Search recipes">
      <button class="btn primary" id="addBtn">+ Add recipe</button>
    </div>
    <div class="filters">
      <div class="chiprow" id="f-meal"><span class="lbl">Meal</span></div>
      <div class="chiprow" id="f-cuisine"><span class="lbl">Cuisine</span></div>
      <div class="chiprow" id="f-tag"><span class="lbl">Tags</span></div>
    </div>
    <div id="grid" class="grid"></div>
    <div class="backup">
      <span class="hint">Keep a copy of every recipe in a file you can restore later.</span>
      <button class="btn small" id="exportBtn">Back up recipes</button>
      <button class="btn small" id="importBtn">Restore from backup</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <button class="btn small ghost" id="signOutBtn" hidden>Sign out</button>
    </div>
  </section>

  <section id="view-list" hidden>
    <div class="glayout">
      <div class="panel">
        <h2>Meals we picked</h2>
        <div id="meals"></div>
        <div class="actions" style="justify-content:flex-start;margin-top:12px"><button class="btn small ghost" id="clearMeals">Clear all meals</button></div>
      </div>
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
          <h2>Shopping list</h2>
          <span class="hint" id="listcount"></span>
        </div>
        <div class="share">
          <button class="btn small primary" id="copyList">Copy list</button>
          <button class="btn small" id="emailList">Email</button>
          <button class="btn small" id="textList">Text</button>
          <button class="btn small" id="saveList">Save as file</button>
          <button class="btn small ghost" id="uncheck">Uncheck all</button>
        </div>
        <div id="glist"></div>
        <form class="addextra" id="extraForm">
          <input id="extraIn" placeholder="Add something else (paper towels, coffee…)" aria-label="Add an extra item">
          <button class="btn small" type="submit">Add</button>
        </form>
      </div>
    </div>
  </section>
</main>

<div id="gate" class="gate" hidden>
  <div class="box">
    <img id="gateIcon" alt="">
    <h2>Recipe Repo</h2>
    <p id="gateMsg">Sign in with your Google account to see your recipes and grocery list.</p>

<script>
const MEALS=["Breakfast","Lunch","Dinner","Side","Dessert","Snack"];
const TAGS=["Vegetarian","Vegan","Quick","Make-ahead","Kid-friendly","Freezer","Gluten-free","Slow cooker"];
const AISLES=[ // first match wins, so specific rules come before broad ones
 ["Pantry",/\b(broth|stock|bouillon|tomato paste|canned|crushed tomato|pureed|tahini|dressing|sauce|oil|vinegar|wine)\b/],
 ["Frozen",/\bfrozen\b/],
 ["Meat & Fish",/\b(chicken|beef|pork|bacon|sausage|turkey|lamb|steak|salmon|tuna|shrimp|fish|cod|prosciutto|ham|chorizo)\b/],
 ["Spices",/\b(salt|black pepper|peppercorns?|cumin|paprika|cinnamon|oregano|chili powder|chili flakes|red pepper flakes|curry powder|turmeric|nutmeg|spices?|bay lea\w*|cayenne|garam masala|coriander|cardamom|vanilla|dried \w+)\b/],
 ["Dairy & Eggs",/\b(milk|butter|cream|cheese|parmesan|mozzarella|cheddar|feta|yogurt|yoghurt|eggs?|sour cream|ricotta)\b/],
 ["Produce",/\b(onions?|garlic|shallots?|tomato(es)?|potato(es)?|carrots?|celery|lettuce|spinach|kale|cabbage|peppers?|bell|jalape\w*|chil(i|e|ies|es)|lemons?|limes?|oranges?|apples?|bananas?|berr\w*|avocados?|cucumbers?|zucchini|squash|mushrooms?|herbs?|basil|cilantro|parsley|mint|dill|thyme|rosemary|ginger|scallions?|leeks?|broccoli|cauliflower|corn|peas|eggplants?|fruit|grapes?|mangos?|pears?|arugula)\b/],
 ["Bakery",/\b(bread|buns?|tortillas?|pita|baguette|rolls?|naan|bagels?)\b/],
 ["Pantry",/\b(flour|sugar|rice|pasta|spaghetti|noodles?|soy|cans?|beans?|lentils?|chickpeas?|oats?|honey|syrup|baking|yeast|nuts?|almonds?|peanuts?|mustard|ketchup|mayo|coconut|chocolate|cocoa|breadcrumbs?|cornstarch)\b/],
];
const UNITS={cup:"cup",cups:"cup",c:"cup",tablespoon:"tbsp",tablespoons:"tbsp",tbsp:"tbsp",tbs:"tbsp",T:"tbsp",teaspoon:"tsp",teaspoons:"tsp",tsp:"tsp",t:"tsp",g:"g",gram:"g",grams:"g",kg:"kg",ml:"ml",l:"l",liter:"l",litre:"l",oz:"oz",ounce:"oz",ounces:"oz",lb:"lb",lbs:"lb",pound:"lb",pounds:"lb",clove:"clove",cloves:"clove",can:"can",cans:"can",tin:"can",tins:"can",pinch:"pinch",bunch:"bunch",bunches:"bunch",slice:"slice",slices:"slice",stick:"stick",sticks:"stick",package:"pkg",packages:"pkg",pkg:"pkg",jar:"jar",jars:"jar",head:"head",heads:"head",sprig:"sprig",sprigs:"sprig",handful:"handful"};
const TAG_KIND={vegetarian:"diet",vegan:"diet","dairy-free":"diet",pescatarian:"diet","gluten-free":"gf",quick:"time","make-ahead":"time",freezer:"time","slow cooker":"time","one-pot":"time","kid-friendly":"kid"};
const tagHtml=t=>`<span class="tag${t==="Example"?" ex":""}" data-k="${TAG_KIND[t.toLowerCase()]||""}">${esc(t)}</span>`;
const FRAC={"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125};

let db=null, user=null, canWrite=true, live=false;
let recipes=[];            // [{id,...}]
let plan={meals:{},checked:{},extras:[]};
const DEFAULT_STAPLES=["salt","black pepper","olive oil"];
const staples=()=>plan.staples??DEFAULT_STAPLES;
const isStaple=e=>{if(e.extra)return false;const n=nameKey(e.name);return staples().some(s=>{const k=nameKey(s);return k&&(n===k||n.endsWith(" "+k));});};
const normPlan=d=>{const p={meals:{...(d?.meals||{})},checked:{...(d?.checked||{})},extras:[...(d?.extras||[])]};if(Array.isArray(d?.staples))p.staples=[...d.staples];return p;};
let filters={meal:null,cuisine:null,tag:null,q:""};
let view="recipes";

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- parsing ---------- */
function parseQty(s){
  s=s.trim();
  let m=s.match(/^(\d+)\s+(\d+)\/(\d+)/); if(m) return [+m[1]+m[2]/m[3], m[0]];
  m=s.match(/^(\d+)\s*([½¼¾⅓⅔⅛])/); if(m) return [+m[1]+FRAC[m[2]], m[0]];
  m=s.match(/^(\d+)\/(\d+)/); if(m) return [m[1]/m[2], m[0]];
  m=s.match(/^(\d+(?:\.\d+)?)(?:\s*[-–]\s*\d+(?:\.\d+)?)?/); if(m) return [+m[1], m[0]];
  m=s.match(/^[½¼¾⅓⅔⅛]/); if(m) return [FRAC[m[0]], m[0]];
  return [null,""];
}
function parseLine(raw){
  let line=raw.replace(/^[-*•\s]+/,"").trim(); if(!line) return null;
  const [qty,used]=parseQty(line);
  let rest=line.slice(used.length).trim();
  let unit="";
  const um=rest.match(/^([A-Za-z]+)\.?\b\s*/);
  if(um && UNITS[um[1]]!==undefined && (qty!==null || ["pinch","bunch","handful"].includes(UNITS[um[1]]))){unit=UNITS[um[1]];rest=rest.slice(um[0].length);}
  rest=rest.replace(/^of\s+/i,"");
  let name=rest, note="";
  const ci=rest.search(/[,(]/); if(ci>0){name=rest.slice(0,ci).trim();note=rest.slice(ci).replace(/^[,\s]+/,"").trim();}
  return {qty,unit,name:name||rest,note,raw:line};
}
function fmtQty(q){
  if(q==null) return "";
  const whole=Math.floor(q+1e-6), f=q-whole;
  const fr=[[0,""],[.125,"⅛"],[.25,"¼"],[1/3,"⅓"],[.5,"½"],[2/3,"⅔"],[.75,"¾"],[1,""]];
  let best=fr[0],bd=9; for(const x of fr){const d=Math.abs(f-x[0]);if(d<bd){bd=d;best=x}}
  if(bd>.04) return (Math.round(q*100)/100).toString();
  const w=whole+(best[0]===1?1:0);
  return (w? w+(best[1]?" ":""):"")+best[1] || "0";
}
const aisleOf=(n,unit)=>{if(unit==="can"||unit==="jar")return "Pantry";const s=n.toLowerCase(); for(const [a,re] of AISLES) if(re.test(s)) return a; return "Other";};
const nameKey=name=>name.toLowerCase().replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim().replace(/(es|s)$/,"");
// Units that can be added together: [family, size in the family's base unit]
const FAM={tsp:["vol",1],tbsp:["vol",3],cup:["vol",48],oz:["wt",1],lb:["wt",16],g:["met",1],kg:["met",1000],ml:["mvol",1],l:["mvol",1000]};
const keyOf=(name,unit)=>nameKey(name)+"|"+(FAM[unit]?.[0]??unit);
const isNice=q=>{const f=q-Math.floor(q);return [0,.125,.25,1/3,.5,2/3,.75,1].some(x=>Math.abs(f-x)<.04);};
// Turn a total in base units back into something you'd write on a list, e.g. 30 tsp -> "½ cup + 2 tbsp".
function baseLabel(fam,b){
  const fq=fmtQty, pl=(u,q)=>q>1&&PLURAL[u]?PLURAL[u]:u;
  if(fam==="vol"){
    if(b>=12){const c=b/48; if(isNice(c)) return fq(c)+" "+pl("cup",c);
      const qc=Math.floor(c*4)/4, rem=b-qc*48; return fq(qc)+" "+pl("cup",qc)+(rem>=.5?" + "+fq(rem/3)+" tbsp":"");}
    if(b>=3&&isNice(b/3)) return fq(b/3)+" tbsp";
    if(b>=3){const t=Math.floor(b/3), rem=b-t*3; return t+" tbsp"+(rem>=.1?" + "+fq(rem)+" tsp":"");}
    return fq(b)+" tsp";
  }
  if(fam==="wt") return b>=16? fq(b/16)+" lb" : fq(b)+" oz";
  if(fam==="met") return b>=1000? fq(b/1000)+" kg" : Math.round(b)+" g";
  if(fam==="mvol") return b>=1000? fq(b/1000)+" l" : Math.round(b)+" ml";
  return "";
}

/* ---------- grocery aggregation ---------- */
function buildList(){
  const map=new Map();
  for(const [rid,m] of Object.entries(plan.meals)){
    const r=recipes.find(x=>x.id===rid); if(!r) continue;
    const factor=(m.servings||r.servings||1)/(r.servings||1);
    for(const ing of r.ingredients||[]){
      if(/^(cold |hot |warm )?water$/i.test(ing.name.trim())) continue; // not something to buy
      const k=keyOf(ing.name,ing.unit), fam=FAM[ing.unit];
      let e=map.get(k);
      if(!e){e={key:k,name:ing.name,unit:ing.unit,fam:fam?.[0],base:0,qty:null,noQty:false,from:new Set(),aisle:aisleOf(ing.name,ing.unit)};map.set(k,e);}
      if(ing.qty==null) e.noQty=true;
      else if(fam) e.base+=ing.qty*factor*fam[1];
      else e.qty=(e.qty||0)+ing.qty*factor;
      e.from.add(r.title);
    }
  }
  for(const e of map.values()) if(e.fam&&e.base>0){e.label=baseLabel(e.fam,e.base);e.qty=e.base;}
  // "Salt" with no amount folds into "½ tsp salt" when both appear
  for(const [k,e] of [...map]) if(e.qty==null&&!e.unit){
    const nk=nameKey(e.name), other=[...map.values()].find(o=>o!==e&&o.qty!=null&&nameKey(o.name)===nk);
    if(other){other.noQty=true;e.from.forEach(f=>other.from.add(f));map.delete(k);}
  }
  for(const x of plan.extras||[]) map.set("x:"+x.id,{key:"x:"+x.id,name:x.text,unit:"",qty:null,from:new Set(),aisle:"Extras",extra:true});
  const order=["Produce","Meat & Fish","Dairy & Eggs","Bakery","Pantry","Spices","Frozen","Other","Extras"];
  const groups={}; for(const e of map.values()) (groups[e.aisle]??=[]).push(e);
  return order.filter(a=>groups[a]).map(a=>[a,groups[a].sort((x,y)=>x.name.localeCompare(y.name))]);
}
const PLURAL={cup:"cups",clove:"cloves",can:"cans",slice:"slices",stick:"sticks",jar:"jars",head:"heads",sprig:"sprigs",bunch:"bunches"};
const unitText=(u,q)=>q>1&&PLURAL[u]?PLURAL[u]:u;
const qtyText=e=>e.label||[fmtQty(e.qty),unitText(e.unit,e.qty)].filter(Boolean).join(" ");
function listText(onlyOpen=true){
  const groups=buildList(); const lines=["Grocery list"];
  const meals=Object.keys(plan.meals).map(id=>recipes.find(r=>r.id===id)?.title).filter(Boolean);
  if(meals.length) lines.push("For: "+meals.join(", "));
  for(const [a,items] of groups){
    const its=items.filter(e=>!isStaple(e)&&(!onlyOpen||!plan.checked[e.key])); if(!its.length) continue;
    lines.push("",a.toUpperCase());
    for(const e of its) lines.push("[ ] "+[qtyText(e),e.name].filter(Boolean).join(" "));
  }
  const have=groups.flatMap(([,i])=>i).filter(isStaple).map(e=>e.name.toLowerCase());
  if(have.length) lines.push("","Check we still have: "+[...new Set(have)].join(", "));
  return lines.join("\n");
}

/* ---------- persistence ---------- */
// Outside claude.ai (or signed out) the app keeps its data in this browser only.
const LOCAL_KEY="recipe-box-v1";
function persistLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify({recipes,plan}));}catch{}}
function loadLocal(){
  let d=null; try{d=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null");}catch{}
  if(d&&Array.isArray(d.recipes)){recipes=d.recipes;plan=normPlan(d.plan);}
  else {recipes=JSON.parse(document.getElementById("examples").textContent);persistLocal();}
  render();
}
let planChain=Promise.resolve();
function savePlan(){
  render();
  if(!live){persistLocal();return;}
  if(!canWrite) return;
  const body=JSON.parse(JSON.stringify(plan));
  planChain=planChain.then(()=>db.doc("plan/current").set(body)).catch(e=>writeFail(e));
}
async function saveRecipe(r){
  const {id,...body}=r;
  if(!live){ const i=recipes.findIndex(x=>x.id===id); if(i>=0) recipes[i]=r; else recipes.push(r); persistLocal(); render(); return; }
  try{ await db.collection("recipes").doc(id).set(body); }catch(e){ writeFail(e); }
}
async function deleteRecipe(id){
  delete plan.meals[id];
  if(!live){ recipes=recipes.filter(r=>r.id!==id); savePlan(); return; }
  try{ await db.collection("recipes").doc(id).delete(); savePlan(); }catch(e){ writeFail(e); }
}
function writeFail(e){
  if(e&&e.code==="denied"){showGate("denied");return;}
  if(e&&e.code==="invalid_argument"){canWrite=false;showNotice("You can view this recipe collection, but you don't have permission to change it. Ask the owner to make you a Contributor.");}
  else if(e&&e.code==="quota_exceeded") toast("Storage is full. Delete a few recipes and try again.");
  else toast("Couldn't save that change. Try again in a moment.");
  render();
}
function showNotice(t,dismissKey){
  const n=$("#notice");
  if(dismissKey){try{if(localStorage.getItem(dismissKey))return;}catch{}}
  n.innerHTML='<span></span>'+(dismissKey?' <button class="btn small ghost" id="noticeX" aria-label="Dismiss">Got it</button>':"");
  n.firstChild.textContent=t; n.hidden=false;
  if(dismissKey) $("#noticeX").onclick=()=>{n.hidden=true;try{localStorage.setItem(dismissKey,"1")}catch{}};
}

/* ---------- rendering ---------- */
function chip(group,val,cur){return `<button class="chip" data-f="${group}" data-v="${esc(val)}" aria-pressed="${cur===val}"${group==="meal"?` data-meal="${esc(val)}"`:""}${group==="tag"?` data-k="${TAG_KIND[val.toLowerCase()]||""}"`:""}>${group==="meal"?'<span class="dot"></span>':group==="tag"?'<span class="tdot"></span>':""}${esc(val)}</button>`;}
function renderFilters(){
  const cuisines=[...new Set(recipes.map(r=>r.cuisine).filter(Boolean))].sort();
  const tags=[...new Set(recipes.flatMap(r=>r.tags||[]))].sort();
  const usedMeals=MEALS.filter(m=>recipes.some(r=>r.mealType===m));
  $("#f-meal").innerHTML='<span class="lbl">Meal</span>'+usedMeals.map(m=>chip("meal",m,filters.meal)).join("");
  $("#f-cuisine").innerHTML='<span class="lbl">Cuisine</span>'+cuisines.map(c=>chip("cuisine",c,filters.cuisine)).join("");
  $("#f-tag").innerHTML='<span class="lbl">Tags</span>'+tags.map(t=>chip("tag",t,filters.tag)).join("");
  $("#f-meal").hidden=!usedMeals.length; $("#f-cuisine").hidden=!cuisines.length; $("#f-tag").hidden=!tags.length;
}
function filtered(){
  const q=filters.q.toLowerCase();
  return recipes.filter(r=>(!filters.meal||r.mealType===filters.meal)&&(!filters.cuisine||r.cuisine===filters.cuisine)&&(!filters.tag||(r.tags||[]).includes(filters.tag))
    &&(!q||r.title.toLowerCase().includes(q)||(r.ingredients||[]).some(i=>i.name.toLowerCase().includes(q)))).sort((a,b)=>a.title.localeCompare(b.title));
}
function renderGrid(){
  const g=$("#grid");
  if(!recipes.length){g.innerHTML=`<div class="empty" style="grid-column:1/-1"><h2>No recipes yet</h2><p>Add your first recipe with <b>+ Add recipe</b>, or bring in recipes you backed up with <b>Restore from backup</b> below.</p></div>`;return;}
  const list=filtered();
  if(!list.length){g.innerHTML=`<div class="empty" style="grid-column:1/-1"><h2>Nothing matches</h2><p>Try a different search or clear a filter.</p></div>`;return;}
  g.innerHTML=list.map(r=>{
    const picked=!!plan.meals[r.id];
        return `<article class="card${picked?" picked":""}" data-meal="${esc(r.mealType||"")}">
      <div class="band"><span>${esc(r.mealType||"Recipe")}</span>${r.time?`<span class="time" title="${esc(r.time)}">${esc(r.time)}</span>`:""}</div>
      <div class="body">
        ${r.cuisine?`<div class="cuisine">${esc(r.cuisine)}</div>`:""}
        <h3><button data-open="${r.id}">${esc(r.title)}</button></h3>
        <div class="tags">${(r.tags||[]).map(tagHtml).join("")}</div>
        <div class="foot"><span class="hint">${(r.ingredients||[]).length} ingredients · serves ${r.servings||"?"}</span>
        <button class="btn small${picked?" primary":""}" data-pick="${r.id}" aria-pressed="${picked}">${picked?"✓ On the list":"+ Add to meals"}</button></div>
      </div>
    </article>`;}).join("");
}
function renderGrocery(){
  const ids=Object.keys(plan.meals).filter(id=>recipes.some(r=>r.id===id));
  $("#meals").innerHTML=ids.length? ids.map(id=>{const r=recipes.find(x=>x.id===id);const s=plan.meals[id].servings||r.servings||1;
    return `<div class="meal" data-meal="${esc(r.mealType||"")}"><span class="dot"></span><div class="nm">${esc(r.title)}</div>
      <div class="stepper" aria-label="Servings"><button data-srv="${id}" data-d="-1" aria-label="Fewer servings">−</button><span>${s} serv</span><button data-srv="${id}" data-d="1" aria-label="More servings">+</button></div>
      <button class="btn small ghost" data-pick="${id}" aria-label="Remove ${esc(r.title)}">✕</button></div>`;}).join("")
    : `<p class="hint">No meals picked yet. Go to <b>Recipes</b> and tap <b>+ Add to meals</b> on what you want to cook.</p>`;
  $("#clearMeals").hidden=!ids.length;
  const all=buildList(); let total=0,open=0;
  const itemHtml=e=>{const done=!!plan.checked[e.key];
    return `<label class="item${done?" done":""}"><input type="checkbox" data-chk="${esc(e.key)}" ${done?"checked":""}><span class="q">${esc(qtyText(e))}${e.noQty&&e.qty!=null?" +":""}</span><span class="n">${esc(e.name)}${e.extra?"":`<span class="from">${esc([...e.from].join(", "))}</span>`}</span>${e.extra?`<button class="btn small ghost" data-rmx="${esc(e.key.slice(2))}" aria-label="Remove">✕</button>`:""}</label>`;};
  const groups=all.map(([a,items])=>[a,items.filter(e=>!isStaple(e))]).filter(([,i])=>i.length);
  const have=all.flatMap(([,i])=>i).filter(isStaple);
  const html=groups.map(([a,items])=>`<div class="aisle"><h3>${esc(a)}</h3>${items.map(e=>{total++;if(!plan.checked[e.key])open++;return itemHtml(e);}).join("")}</div>`).join("");
  const st=staples();
  const staplesHtml=`<div class="staples"><h3>Probably have already</h3>
    ${have.length?have.map(itemHtml).join(""):`<p class="hint" style="margin:0">Nothing on this list matches your staples.</p>`}
    <div class="staplechips">${st.map(x=>`<span class="chip">${esc(x)}${canWrite?` <button class="btn small ghost" style="padding:0 2px" data-rmstaple="${esc(x)}" aria-label="Remove ${esc(x)} from staples">✕</button>`:""}</span>`).join("")}
    ${canWrite?`<form id="stapleForm"><input id="stapleIn" placeholder="Add something you always have" aria-label="Add a staple"><button class="btn small" type="submit">Add</button></form>`:""}</div>
    <p class="hint" style="margin:6px 0 0">Staples stay off the list you copy or send, with a reminder to check them.</p></div>`;
  $("#glist").innerHTML=(all.length? html : `<p class="hint" style="margin-top:14px">Your list fills in as you pick meals. You can also add extra items below.</p>`)+(all.length?staplesHtml:"");
  const sf=$("#stapleForm"); if(sf) sf.onsubmit=ev=>{ev.preventDefault();const v=$("#stapleIn").value.trim().toLowerCase();if(!v)return;
    if(!st.includes(v)){plan.staples=[...st,v];savePlan();} setTimeout(()=>$("#stapleIn")?.focus(),0);};
  $("#listcount").textContent=total? `${open} of ${total} left to buy`:"";
  $("#mealcount").textContent=ids.length;
}
function render(){ renderFilters(); renderGrid(); renderGrocery();
  $("#addBtn").disabled=!canWrite; $("#importBtn").disabled=!canWrite; }

function setView(v){view=v;
  $("#view-recipes").hidden=v!=="recipes"; $("#view-list").hidden=v!=="list";
  $("#tab-recipes").setAttribute("aria-selected",v==="recipes"); $("#tab-list").setAttribute("aria-selected",v==="list");
  try{history.replaceState(null,"","#"+v)}catch{}
}

/* ---------- dialogs ---------- */
function openSheet(html,meal){const o=$("#overlay");o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"${meal!=null?` data-meal="${esc(meal)}"`:""}>${html}</div>`;o.hidden=false;o.querySelector("input,button")?.focus();}
function closeSheet(){$("#overlay").hidden=true;$("#overlay").innerHTML="";releaseWake();}
// Keep the screen awake while a recipe is open (cooking mode)
let wake=null, wantWake=false;
async function requestWake(){try{wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null;syncWakeBtn();});}catch{wake=null;toast("This device won't keep the screen on from here.");wantWake=false;}syncWakeBtn();}
function releaseWake(){wantWake=false;try{wake?.release();}catch{}wake=null;}
function syncWakeBtn(){const b=$("#wakeBtn");if(b)b.setAttribute("aria-pressed",!!wake);}
document.addEventListener("visibilitychange",()=>{if(wantWake&&!wake&&document.visibilityState==="visible")requestWake();});
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeSheet();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#overlay").hidden)closeSheet();});

function showRecipe(id){
  const r=recipes.find(x=>x.id===id); if(!r) return;
  const picked=!!plan.meals[id];
  openSheet(`<div class="sheetband"><span>${esc(r.mealType||"Recipe")}${r.cuisine?" · "+esc(r.cuisine):""}</span><span class="time">${r.time?esc(r.time)+" · ":""}serves ${r.servings||"?"}</span></div>
    <div class="top"><h2>${esc(r.title)}</h2><button class="btn ghost" data-close aria-label="Close">✕</button></div>
    <div class="tags">${(r.tags||[]).map(tagHtml).join("")}</div>
    <h3>Ingredients</h3><ul class="ing">${(r.ingredients||[]).map(i=>`<li><span class="q">${esc([fmtQty(i.qty),unitText(i.unit,i.qty)].filter(Boolean).join(" "))}</span><span>${esc(i.name)}${i.note?`<span class="hint">${i.note.startsWith("(")?" ":", "}${esc(i.note)}</span>`:""}</span></li>`).join("")}</ul>
    ${r.steps?`<h3>Steps</h3><p class="steps">${esc(r.steps)}</p>`:""}
    ${r.source?`<p class="hint">Source: ${/^https?:\/\//.test(r.source)?`<a href="${esc(r.source)}" target="_blank" rel="noopener">${esc(r.source)}</a>`:esc(r.source)}</p>`:""}
    <div class="actions">
      ${"wakeLock" in navigator?`<button class="btn wake" id="wakeBtn" aria-pressed="${!!wake}" style="margin-right:auto">☀ Keep screen on</button>`:""}
      ${canWrite?`<button class="btn danger ghost" data-del="${id}">Delete</button><button class="btn" data-edit="${id}">Edit</button>`:""}
      <button class="btn primary" data-pick="${id}" data-close>${picked?"Remove from meals":"+ Add to meals"}</button>
    </div>`, r.mealType||"");
}
function editRecipe(id){
  const r=id?recipes.find(x=>x.id===id):{title:"",mealType:"Dinner",cuisine:"",tags:[],servings:4,time:"",ingredients:[],steps:"",source:""};
  const cuisines=[...new Set(recipes.map(x=>x.cuisine).filter(Boolean))];
  const allTags=[...new Set([...TAGS,...recipes.flatMap(x=>x.tags||[])])].filter(t=>t!=="Example");
  openSheet(`<div class="top"><h2>${id?"Edit recipe":"Add a recipe"}</h2><button class="btn ghost" data-close aria-label="Close">✕</button></div>
  <form id="rform" class="form">
    <div class="field full"><label for="f-title">Name</label><input id="f-title" required value="${esc(r.title)}" placeholder="Grandma's chicken soup"></div>
    <div class="field"><label for="f-meal">Meal</label><select id="f-meal">${MEALS.map(m=>`<option ${m===r.mealType?"selected":""}>${m}</option>`).join("")}</select></div>
    <div class="field"><label for="f-cuisine">Cuisine</label><input id="f-cuisine" list="cuisines" value="${esc(r.cuisine)}" placeholder="Italian, Mexican…"><datalist id="cuisines">${cuisines.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div>
    <div class="field"><label for="f-serv">Serves</label><input id="f-serv" type="number" min="1" value="${r.servings||4}"></div>
    <div class="field"><label for="f-time">Time</label><input id="f-time" value="${esc(r.time)}" placeholder="30 min"></div>
    <div class="field full"><label>Tags</label><div class="chiprow" id="f-tags">${allTags.map(t=>`<button type="button" class="chip" data-tg="${esc(t)}" aria-pressed="${(r.tags||[]).includes(t)}">${esc(t)}</button>`).join("")}</div>
      <input id="f-newtag" placeholder="Add your own tag and press Enter" style="margin-top:6px"></div>
    <div class="field full"><label for="f-ing">Ingredients, one per line</label><textarea id="f-ing" rows="8" placeholder="2 cups flour&#10;1 1/2 lb chicken thighs&#10;3 cloves garlic, minced&#10;Salt">${esc((r.ingredients||[]).map(i=>i.raw).join("\n"))}</textarea>
      <span class="hint">Start each line with the amount and unit if there is one. Matching ingredients across meals are combined.</span></div>
    <div class="field full"><label for="f-steps">Steps</label><textarea id="f-steps" rows="6">${esc(r.steps)}</textarea></div>
    <div class="field full"><label for="f-src">Source or link</label><input id="f-src" value="${esc(r.source)}"></div>
    <div class="actions full"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary" type="submit">${id?"Save changes":"Add recipe"}</button></div>
  </form>`);
  const form=$("#rform");
  form.querySelector("#f-tags").addEventListener("click",e=>{const b=e.target.closest("[data-tg]");if(b)b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");});
  form.querySelector("#f-newtag").addEventListener("keydown",e=>{if(e.key!=="Enter")return;e.preventDefault();const v=e.target.value.trim();if(!v)return;
    form.querySelector("#f-tags").insertAdjacentHTML("beforeend",`<button type="button" class="chip" data-tg="${esc(v)}" aria-pressed="true">${esc(v)}</button>`);e.target.value="";});
  form.addEventListener("submit",async e=>{e.preventDefault();
    const tags=[...form.querySelectorAll('[data-tg][aria-pressed="true"]')].map(b=>b.dataset.tg);
    if(id&&(r.tags||[]).includes("Example")) tags.push("Example");
    const rec={id:id||("r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
      title:$("#f-title").value.trim(),mealType:$("#f-meal").value,cuisine:$("#f-cuisine").value.trim(),
      servings:Math.max(1,parseInt($("#f-serv").value)||1),time:$("#f-time").value.trim(),tags,
      ingredients:$("#f-ing").value.split("\n").map(parseLine).filter(Boolean),
      steps:$("#f-steps").value.trim(),source:$("#f-src").value.trim(),createdAt:r.createdAt||new Date().toISOString()};
    if(!rec.title) return;
    closeSheet(); await saveRecipe(rec); toast(id?"Recipe saved":"Recipe added");
  });
}
function copyFallback(text){
  openSheet(`<div class="top"><h2>Copy your list</h2><button class="btn ghost" data-close aria-label="Close">✕</button></div>
    <p class="hint">Your browser blocked automatic copying. The list is selected below; copy it with Ctrl+C or ⌘C (long-press on a phone).</p>
    <textarea class="copybox" id="cb" readonly>${esc(text)}</textarea>`);
  const t=$("#cb"); t.focus(); t.select();
}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200);}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-open]"); if(!t) return;
  if(t.dataset.view) return setView(t.dataset.view);
  if(t.dataset.f){const k=t.dataset.f;filters[k]=filters[k]===t.dataset.v?null:t.dataset.v;return render();}
  if(t.dataset.open) return showRecipe(t.dataset.open);
  if(t.dataset.pick){ if(!canWrite) return; const id=t.dataset.pick;
    if(plan.meals[id]) delete plan.meals[id]; else {const r=recipes.find(x=>x.id===id);plan.meals[id]={servings:r?.servings||1};toast("Added to this week's meals");}
    savePlan(); }
  if(t.dataset.srv){ if(!canWrite) return; const m=plan.meals[t.dataset.srv]; m.servings=Math.max(1,(m.servings||1)+ +t.dataset.d); savePlan(); }
  if(t.id==="wakeBtn"){ if(wake){releaseWake();syncWakeBtn();} else {wantWake=true;await requestWake();if(wake)toast("Screen stays on while this recipe is open.");} return; }
  if(t.dataset.edit) return editRecipe(t.dataset.edit);
  if(t.dataset.del){ if(t.dataset.armed){closeSheet();await deleteRecipe(t.dataset.del);toast("Recipe deleted");return;}
    t.dataset.armed="1"; t.textContent="Tap again to delete"; return; }
  if(t.dataset.rmstaple){ e.preventDefault(); plan.staples=staples().filter(x=>x!==t.dataset.rmstaple); savePlan(); return; }
  if(t.dataset.rmx){ e.preventDefault(); plan.extras=plan.extras.filter(x=>x.id!==t.dataset.rmx); delete plan.checked["x:"+t.dataset.rmx]; savePlan(); }
  if(t.hasAttribute("data-close")) closeSheet();
});
document.addEventListener("change",e=>{const k=e.target.dataset?.chk; if(k==null) return;
  if(!canWrite){e.target.checked=!e.target.checked;return;}
  if(e.target.checked) plan.checked[k]=true; else delete plan.checked[k]; savePlan();});
$("#addBtn").onclick=()=>editRecipe(null);
$("#q").addEventListener("input",e=>{filters.q=e.target.value;renderGrid();});
$("#clearMeals").onclick=()=>{plan.meals={};plan.checked={};savePlan();};
$("#uncheck").onclick=()=>{plan.checked={};savePlan();};
$("#extraForm").addEventListener("submit",e=>{e.preventDefault();const v=$("#extraIn").value.trim();if(!v||!canWrite)return;
  plan.extras=[...(plan.extras||[]),{id:Date.now().toString(36),text:v}];$("#extraIn").value="";savePlan();});
$("#copyList").onclick=()=>{const text=listText();
  try{navigator.clipboard.writeText(text).then(()=>toast("List copied. Paste it into a text, email or notes app."),()=>copyFallback(text));}catch{copyFallback(text);}};
$("#emailList").onclick=()=>{const text=listText();
  try{navigator.clipboard.writeText(text).catch(()=>{});}catch{}
  const a=document.createElement("a");a.href="mailto:?subject="+encodeURIComponent("Grocery list")+"&body="+encodeURIComponent(text);a.target="_blank";a.rel="noopener";a.click();
  toast("Opening your email app. The list is also copied in case it doesn't open.");};
$("#textList").onclick=()=>{const text=listText();
  try{navigator.clipboard.writeText(text).catch(()=>{});}catch{}
  const a=document.createElement("a");a.href="sms:?&body="+encodeURIComponent(text);a.target="_blank";a.rel="noopener";a.click();
  toast("Opening Messages. The list is also copied in case it doesn't open.");};
let downloads=null;
$("#saveList").onclick=()=>saveFile("grocery-list.txt",listText(),"text/plain");

/* ---------- backup and restore ---------- */
async function saveFile(filename,text,type){
  if(downloads){ try{await downloads.save({filename,data:text});return true;}catch{toast("The file wasn't saved.");return false;} }
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return true;}
  catch{copyFallback(text);return false;}
}
$("#exportBtn").onclick=async()=>{
  if(!recipes.length){toast("There are no recipes to back up yet.");return;}
  const data={app:"recipe-box",format:1,exportedAt:new Date().toISOString(),staples:plan.staples,recipes:recipes.map(({id,...r})=>({id,...r}))};
  const ok=await saveFile(`recipe-box-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(data,null,2),"application/json");
  if(ok&&!downloads) toast(`Saved ${recipes.length} recipes to your downloads.`);
};
$("#importBtn").onclick=()=>{ if(!canWrite){toast("You can't change this recipe collection.");return;} $("#importFile").value=""; $("#importFile").click(); };
const cleanId=id=>typeof id==="string"&&/^[A-Za-z0-9_-]{1,80}$/.test(id)?id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function cleanRecipe(r){
  if(!r||typeof r.title!=="string"||!r.title.trim()) return null;
  const str=v=>typeof v==="string"?v.slice(0,20000):"";
  const ings=(Array.isArray(r.ingredients)?r.ingredients:[]).map(i=>typeof i==="string"?parseLine(i):(i&&typeof i.raw==="string"?parseLine(i.raw):null)).filter(Boolean);
  return {id:cleanId(r.id),title:str(r.title).trim(),mealType:MEALS.includes(r.mealType)?r.mealType:"Dinner",cuisine:str(r.cuisine),
    servings:Math.max(1,parseInt(r.servings)||1),time:str(r.time),tags:(Array.isArray(r.tags)?r.tags:[]).filter(t=>typeof t==="string").slice(0,20),
    ingredients:ings,steps:str(r.steps),source:str(r.source),createdAt:str(r.createdAt)||new Date().toISOString()};
}
$("#importFile").addEventListener("change",async e=>{
  const f=e.target.files?.[0]; if(!f) return;
  let data; try{data=JSON.parse(await f.text());}catch{toast("That file isn't a recipe backup.");return;}
  const list=(Array.isArray(data?.recipes)?data.recipes:[]).map(cleanRecipe).filter(Boolean);
  if(!list.length){toast("No recipes found in that file.");return;}
  const ids=new Set(recipes.map(r=>r.id)); const upd=list.filter(r=>ids.has(r.id)).length;
  openSheet(`<div class="top"><h2>Restore recipes</h2><button class="btn ghost" data-close aria-label="Close">✕</button></div>
    <p>This backup has <b>${list.length}</b> recipe${list.length>1?"s":""}. ${list.length-upd} will be added${upd?` and <b>${upd}</b> will replace recipes you already have`:""}. Recipes that aren't in the backup are kept.</p>
    <div class="actions"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="doImport">Restore ${list.length} recipe${list.length>1?"s":""}</button></div>`);
  $("#doImport").onclick=async()=>{
    closeSheet();
    if(Array.isArray(data.staples)&&!plan.staples){plan.staples=data.staples.filter(x=>typeof x==="string");savePlan();}
    if(!live){for(const r of list){const i=recipes.findIndex(x=>x.id===r.id);if(i>=0)recipes[i]=r;else recipes.push(r);}persistLocal();render();}
    else{ for(const r of list){const {id,...body}=r; try{await db.collection("recipes").doc(id).set(body);}catch(err){writeFail(err);return;}} }
    toast(`Restored ${list.length} recipe${list.length>1?"s":""}.`);
  };
});

/* ---------- install as an app (Android Chrome) ---------- */
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;$("#installBtn").hidden=false;});
window.addEventListener("appinstalled",()=>{installEvt=null;$("#installBtn").hidden=true;toast("Installed. Open Recipe Repo from your home screen.");});
$("#installBtn").onclick=async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice;}catch{}installEvt=null;$("#installBtn").hidden=true;};

/* ---------- shared storage in Firebase (the hosted / installed app) ---------- */
let cloud=null, cloudUser=null, unsubs=[];
function showGate(state,msg){
  const g=$("#gate"); g.hidden=false; if(!$("#gateIcon").src) $("#gateIcon").src="icons/icon-192.png";
  $("#gateErr").hidden=!msg; $("#gateErr").textContent=msg||"";
  const denied=state==="denied";
  $("#gateMsg").textContent=denied
    ? `${cloudUser?.email||"This account"} doesn't have access to these recipes. Sign in with one of the accounts that does.`
    : "Sign in with your Google account to see your recipes and grocery list.";
  $("#signInBtn").hidden=denied; $("#gateSignOut").hidden=!denied;
  if(denied){unsubs.forEach(u=>u());unsubs=[];live=false;}
}
async function startCloud(cfg){
  $("#status").textContent="Connecting…";
  try{ cloud=await (await import("./firebase-store.js")).connect(cfg); }
  catch(e){ showGate("error","Couldn't reach Recipe Repo. Check your connection and reopen the app."); return; }
  db=cloud.db;
  $("#signInBtn").onclick=async()=>{ $("#gateErr").hidden=true;
    try{await cloud.signIn();}catch(e){showGate("signin","Sign-in didn't finish. Try again.");} };
  $("#gateSignOut").onclick=$("#signOutBtn").onclick=async()=>{ await cloud.signOut(); };
  cloud.onUser(u=>{
    unsubs.forEach(f=>f()); unsubs=[]; cloudUser=u;
    if(!u){ live=false; recipes=[]; plan=normPlan(null); render(); $("#signOutBtn").hidden=true; $("#status").textContent="Signed out"; showGate("signin"); return; }
    $("#gate").hidden=true; live=true; canWrite=true;
    $("#status").textContent="Shared"; $("#signOutBtn").hidden=false; $("#signOutBtn").textContent=`Sign out (${u.email})`;
    const onErr=e=>{ if(e.code==="denied") showGate("denied"); else toast("Lost connection. Changes will sync when you're back online."); };
    unsubs.push(db.collection("recipes").onSnapshot(s=>{recipes=s.docs.map(d=>({id:d.id,...d.data()}));render();},onErr));
    unsubs.push(db.doc("plan/current").onSnapshot(s=>{plan=normPlan(s.data());render();},onErr));
  });
}

/* ---------- boot ---------- */
setView(location.hash==="#list"?"list":"recipes");
window.addEventListener("hashchange",()=>setView(location.hash==="#list"?"list":"recipes"));
render();
(async()=>{
  const c=window.claude;
  const localMode=msg=>{ $("#status").textContent="On this device"; showNotice(msg,"rb-local-notice"); loadLocal(); };
  if(!c||!c.use){
    if(window.FIREBASE_CONFIG){ startCloud(window.FIREBASE_CONFIG); return; }
    localMode("Recipes and lists are saved on this device only. Use Copy, Email or Text to share a list."); return;
  }
  [db,user,downloads]=await Promise.all([c.use("db"),c.use("user"),c.use("downloads")]);
  if(!db){ localMode("Sign in to Claude to see your shared recipes. Until then, changes are saved in this browser only."); return; }
  live=true;
  const w=user?await user.can("data.write"):null; if(w===false){canWrite=false;showNotice("You're viewing this recipe collection. Ask the owner to make you a Contributor so you can add recipes and check off groceries.");}
  $("#status").textContent="Shared";
  db.collection("recipes").onSnapshot(s=>{recipes=s.docs.map(d=>({id:d.id,...d.data()}));render();},e=>{if(e.code!=="revoked")toast("Lost connection to your recipes. Reload to reconnect.");});
  db.doc("plan/current").onSnapshot(s=>{plan=normPlan(s.data());render();});
})();
</script>
